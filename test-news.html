<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Test — Generate News Brief</title>
<style>
  body { background:#0B0F1A; color:#E7E9F0; font-family:-apple-system,sans-serif; max-width:640px; margin:40px auto; padding:0 16px; }
  h1 { font-size:20px; }
  input { width:100%; margin-bottom:8px; background:#121826; border:1px solid #262E45; border-radius:5px; padding:10px; color:#E7E9F0; box-sizing:border-box; }
  button { background:#C9A24B; color:#14100A; border:none; border-radius:5px; padding:12px 20px; font-weight:700; cursor:pointer; margin-top:8px; }
  button:disabled { opacity:0.5; cursor:default; }
  pre { background:#121826; border:1px solid #262E45; border-radius:6px; padding:16px; white-space:pre-wrap; word-break:break-word; font-size:12.5px; margin-top:20px; }
  #status { font-size:13px; color:#9099B3; margin-top:10px; }
</style>
</head>
<body>
<h1>Test: generate-news-brief</h1>
<p>Sign in, then click the button. This calls the edge function directly and shows the raw result — nothing here gets saved anywhere.</p>
<input type="email" id="email" placeholder="Email">
<input type="password" id="password" placeholder="Password">
<button type="button" id="login-btn">Sign in</button>
<div id="status"></div>
<button type="button" id="generate-btn" disabled>Generate news (test)</button>
<pre id="output">(nothing yet)</pre>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const sb = window.supabase.createClient(
    "https://zkwrqdpumffwrkedhkch.supabase.co",
    "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inprd3JxZHB1bWZmd3JrZWRoa2NoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgyNTE1MzUsImV4cCI6MjEwMzgyNzUzNX0.x4FT30VdOp1dvQ67citcjn3Cfm2ZD3JwVNuKFmKXr0w"
  );

  const statusEl = document.getElementById("status");
  const generateBtn = document.getElementById("generate-btn");
  const output = document.getElementById("output");

  sb.auth.onAuthStateChange((event, session) => {
    generateBtn.disabled = !session;
    statusEl.textContent = session ? `Signed in as ${session.user.email}` : "Not signed in";
  });

  document.getElementById("login-btn").addEventListener("click", async () => {
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    const { error } = await sb.auth.signInWithPassword({ email, password });
    if (error) statusEl.textContent = "Login error: " + error.message;
  });

  generateBtn.addEventListener("click", async () => {
    generateBtn.disabled = true;
    generateBtn.textContent = "Generating... (can take up to a minute)";
    output.textContent = "Waiting for response...";
    const { data, error } = await sb.functions.invoke("generate-news-brief", { body: {} });
    generateBtn.disabled = false;
    generateBtn.textContent = "Generate news (test)";
    if (error) {
      let message = error.message;
      if (error.context && typeof error.context.json === "function") {
        try {
          const body = await error.context.json();
          message = JSON.stringify(body, null, 2);
        } catch (parseErr) {
          // context wasn't valid JSON — fall back to the generic message
        }
      }
      output.textContent = "ERROR:\n" + message;
      return;
    }
    output.textContent = JSON.stringify(data, null, 2);
  });
</script>
</body>
</html>
